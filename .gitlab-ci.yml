# Ticket #28 AC #7: "Harness runnable in CI, not just locally." This is
# the first CI config in this repo — scoped narrowly to the eval harness
# (voice-service/src/eval/), not a general monorepo-wide pipeline for
# mobile/app-service/voice-service's own test suites, which is a larger,
# separate concern outside this ticket.
#
# Disclosed limitation (docs/adr/0012): this GitLab project has no CI
# runners registered (confirmed via the API — empty runner list, zero
# pipeline history) at the time this was written. This file is correct
# and will run the moment a runner is registered, but that has not been
# verified to actually execute here.

image: node:20

stages:
  - eval
  - observability

variables:
  # GitLab's default shallow clone can omit the target-branch history the
  # append-only job needs to diff against — full history avoids a job
  # that fails for the wrong reason (missing ref) rather than a real edit.
  GIT_DEPTH: '0'

# AC #1 / UAT #3: golden-set.ts is append-only. Runs on every MR against
# its target branch — a real edit to an existing entry fails the
# pipeline, not just a local convention (append-only.ts).
eval:golden-set-append-only:
  stage: eval
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
  before_script:
    - corepack enable
    - cd voice-service && pnpm install --frozen-lockfile
  script:
    - pnpm eval:golden-set-append-only "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"

# AC #2/#3/#5: mechanical assertions, gate computation, and golden-set
# content sanity — all offline (no model call, no ANTHROPIC_API_KEY
# needed), so this runs unconditionally on every pipeline.
eval:offline-tests:
  stage: eval
  before_script:
    - corepack enable
    - cd voice-service && pnpm install --frozen-lockfile
  script:
    - pnpm exec jest src/eval/

# AC #4/#6: the full harness against the real Claude Sonnet 5 persona
# pipeline (ticket #14) and the Opus 5 judge — real, billed model calls.
# Only runs if ANTHROPIC_API_KEY is configured as a CI/CD variable in
# this project's settings (Settings > CI/CD > Variables) — not something
# this file can provision on its own. `allow_failure` so a missing key
# doesn't block MRs; once configured, gate failures do fail the job.
eval:harness:
  stage: eval
  rules:
    - if: '$ANTHROPIC_API_KEY'
  allow_failure: true
  before_script:
    - corepack enable
    - cd voice-service && pnpm install --frozen-lockfile
  script:
    - pnpm eval

# Ticket #29 AC #2 (PRD §11): "point the eval harness at production ...
# five golden cases against the live endpoint hourly." Triggered by a
# GitLab CI Pipeline Schedule (Settings > CI/CD > Schedules, "hourly",
# targeting main) — not expressible in this file alone, has to be
# configured in project settings. `$CANARY_SCHEDULE` is a custom
# schedule variable set on that schedule (not a GitLab-provided one) so
# this job runs only for the scheduled canary trigger, not on every
# ordinary pipeline (which would silently multiply spend far past the
# "~$0.20/day" budget the five-entry canary set is sized for).
# `allow_failure: false` deliberately, unlike eval:harness above — a
# canary gate failure is meant to fail this pipeline loudly (it also
# separately pages via HEALTH_ALERT_WEBHOOK_URL, see run-canary.ts), not
# be waved through the way a missing ANTHROPIC_API_KEY locally is.
#
# Same disclosed limitation as eval:harness/docs/adr/0012 above: no CI
# runners are registered on this project, so neither the schedule nor
# this job have been verified to actually execute here.
eval:canary:
  stage: eval
  rules:
    - if: '$CANARY_SCHEDULE'
  before_script:
    - corepack enable
    - cd voice-service && pnpm install --frozen-lockfile
  script:
    - pnpm eval:canary

# Ticket #29 AC #4/#5 (PRD §11): "alerting when a user crosses their
# subscription price" and "alerting configured on P95, never mean" — the
# other half of this ticket's periodic checks (app-service's
# run-checks.ts), same trigger shape as eval:canary above: a GitLab CI
# Pipeline Schedule (Settings > CI/CD > Schedules — hourly or daily,
# targeting main) sets `$OBSERVABILITY_SCHEDULE`, a custom variable (not
# GitLab-provided), so this job runs only on that schedule, not on every
# ordinary pipeline. Also sends the unconditional weekly quality digest
# in the same run (run-checks.ts's own `sendQualityReport` call) — one
# scheduled job covers all three of this ticket's periodic checks
# (P95, cost, quality digest), since all three read the same `turns`
# data and there's no reason to pay three separate `pnpm install`s to
# split them.
#
# Same disclosed limitation as eval:canary/docs/adr/0012 above: no CI
# runners are registered on this project, so neither the schedule nor
# this job have been verified to actually execute here. Needs
# `DATABASE_URL` (and optionally `HEALTH_ALERT_WEBHOOK_URL`/
# `QUALITY_REPORT_WEBHOOK_URL`) configured as CI/CD variables — app-service's
# own env.ts requirement, unchanged by this ticket.
observability:run-checks:
  stage: observability
  rules:
    - if: '$OBSERVABILITY_SCHEDULE'
  before_script:
    - corepack enable
    - cd app-service && pnpm install --frozen-lockfile
  script:
    - pnpm observability:run-checks
